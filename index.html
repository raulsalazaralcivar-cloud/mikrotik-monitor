<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="MikroMon"/>
  <meta name="theme-color" content="#0a0e1a"/>
  <title>MikroMon</title>
  <link rel="apple-touch-icon" href="icon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --border: #1e2d45;
      --accent: #00d4ff;
      --accent2: #ff6b35;
      --green: #00ff88;
      --text: #c8d8e8;
      --muted: #4a6080;
      --font-mono: 'Share Tech Mono', monospace;
      --font-main: 'Exo 2', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    #app { position: relative; z-index: 1; padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }

    /* ─── Header ─── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(0,212,255,0.05) 0%, transparent 100%);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      border: 2px solid var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .logo-icon::after {
      content: '';
      position: absolute;
      width: 100%; height: 2px;
      background: var(--accent);
      animation: scan 2s linear infinite;
    }

    @keyframes scan {
      0% { top: -2px; } 100% { top: 100%; }
    }

    .logo-icon svg { z-index: 1; }

    .logo h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .logo span {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--muted);
      display: block;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 3px rgba(74,96,128,0.2);
      transition: all 0.3s;
    }
    .status-dot.online {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(0,255,136,0.2), 0 0 12px rgba(0,255,136,0.5);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { box-shadow: 0 0 0 3px rgba(0,255,136,0.2), 0 0 12px rgba(0,255,136,0.4); }
      50% { box-shadow: 0 0 0 6px rgba(0,255,136,0.1), 0 0 20px rgba(0,255,136,0.6); }
    }

    /* ─── Screens ─── */
    .screen { display: none; padding: 20px; }
    .screen.active { display: block; }

    /* ─── Config form ─── */
    .config-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .config-card h2 {
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .config-card h2::before {
      content: '//';
      color: var(--muted);
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--muted);
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
    }

    input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-family: var(--font-main);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, #0098c8 100%);
      color: #000;
    }

    .btn-primary:active { transform: scale(0.98); opacity: 0.9; }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      padding: 10px;
      margin-top: 8px;
    }

    .error-msg {
      background: rgba(255,60,60,0.1);
      border: 1px solid rgba(255,60,60,0.3);
      border-radius: 8px;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: #ff6b6b;
      margin-top: 12px;
      display: none;
    }

    /* ─── Dashboard ─── */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }

    .stat-card.down::before { background: var(--accent); }
    .stat-card.up::before { background: var(--accent2); }

    .stat-label {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stat-label svg { opacity: 0.7; }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 2px;
    }

    .stat-card.down .stat-value { color: var(--accent); }
    .stat-card.up .stat-value { color: var(--accent2); }

    .stat-unit {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    /* ─── Chart ─── */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .chart-title {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .chart-legend {
      display: flex;
      gap: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--muted);
    }

    .legend-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }

    .chart-wrap {
      position: relative;
      height: 180px;
    }

    canvas { width: 100% !important; }

    /* interface selector */
    .iface-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .iface-row::-webkit-scrollbar { display: none; }

    .iface-btn {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .iface-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,212,255,0.08);
    }

    /* totals */
    .totals-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .total-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .total-label {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--muted);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .total-value {
      font-size: 16px;
      font-weight: 600;
      font-family: var(--font-mono);
    }

    .total-card.rx .total-value { color: var(--accent); }
    .total-card.tx .total-value { color: var(--accent2); }

    /* interval & last update */
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }

    .footer-row span {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--muted);
    }

    .footer-row .update-time { color: var(--green); }

    /* Loader */
    .loader {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn .loader { width: 18px; height: 18px; border-color: rgba(0,0,0,0.2); border-top-color: #000; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </div>
      <div>
        <h1>MikroMon</h1>
        <span>NETWORK MONITOR</span>
      </div>
    </div>
    <div id="statusDot" class="status-dot"></div>
  </header>

  <!-- CONFIG SCREEN -->
  <div id="screenConfig" class="screen active">
    <div class="config-card">
      <h2>Conexión</h2>
      <div class="field">
        <label>IP Pública / Hostname</label>
        <input id="cfgHost" type="text" placeholder="190.xxx.xxx.xxx" autocomplete="off" autocorrect="off" spellcheck="false"/>
      </div>
      <div class="field">
        <label>Puerto API</label>
        <input id="cfgPort" type="number" value="8728"/>
      </div>
      <div class="field">
        <label>Usuario</label>
        <input id="cfgUser" type="text" placeholder="admin" autocomplete="off"/>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input id="cfgPass" type="password" placeholder="••••••"/>
      </div>
      <button class="btn btn-primary" id="btnConnect">
        CONECTAR
      </button>
      <div class="error-msg" id="errMsg"></div>
    </div>

    <div class="config-card">
      <h2>Backend URL</h2>
      <div class="field">
        <label>URL de tu servidor (Render/Railway)</label>
        <input id="cfgBackend" type="url" placeholder="https://tu-app.onrender.com" autocomplete="off" autocorrect="off"/>
      </div>
      <p style="font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-top:8px;">
        Ingresa la URL de tu backend desplegado en Render o Railway.
      </p>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="screenDash" class="screen">
    <!-- Interface selector -->
    <div class="iface-row" id="ifaceRow"></div>

    <!-- Live stats -->
    <div class="stats-row">
      <div class="stat-card down">
        <div class="stat-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 18"/></svg>
          DOWNLOAD
        </div>
        <div class="stat-value" id="rxSpeed">—</div>
        <div class="stat-unit">Mbps</div>
      </div>
      <div class="stat-card up">
        <div class="stat-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="17 6 12 11 7 6"/><polyline points="17 13 12 18 7 13"/></svg>
          UPLOAD
        </div>
        <div class="stat-value" id="txSpeed">—</div>
        <div class="stat-unit">Mbps</div>
      </div>
    </div>

    <!-- Chart -->
    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">TRÁFICO EN TIEMPO REAL</span>
        <div class="chart-legend">
          <div class="legend-item">
            <div class="legend-dot" style="background:#00d4ff"></div>
            RX
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:#ff6b35"></div>
            TX
          </div>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="trafficChart"></canvas>
      </div>
    </div>

    <!-- Totals -->
    <div class="totals-row">
      <div class="total-card rx">
        <div class="total-label">TOTAL RX</div>
        <div class="total-value" id="totalRx">— GB</div>
      </div>
      <div class="total-card tx">
        <div class="total-label">TOTAL TX</div>
        <div class="total-value" id="totalTx">— GB</div>
      </div>
    </div>

    <div class="footer-row">
      <span>Actualiza cada 3s</span>
      <span class="update-time" id="lastUpdate">—</span>
      <button class="btn btn-secondary" id="btnDisconnect" style="width:auto;padding:6px 14px;margin:0;">⏻ Salir</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ─── State ────────────────────────────────────────────────────────────────────
const MAX_POINTS = 30;
let backendUrl = '';
let credentials = {};
let selectedIface = '';
let pollTimer = null;
let prevRx = null, prevTx = null, prevTs = null;
let chart = null;

const rxData = Array(MAX_POINTS).fill(0);
const txData = Array(MAX_POINTS).fill(0);
const labels  = Array(MAX_POINTS).fill('');

// ─── Persist config ───────────────────────────────────────────────────────────
function saveConfig() {
  try {
    sessionStorage.setItem('mktcfg', JSON.stringify({ backendUrl, credentials }));
  } catch {}
}

function loadConfig() {
  try {
    const s = sessionStorage.getItem('mktcfg');
    if (s) {
      const c = JSON.parse(s);
      backendUrl = c.backendUrl || '';
      credentials = c.credentials || {};
      document.getElementById('cfgBackend').value = backendUrl;
      document.getElementById('cfgHost').value = credentials.host || '';
      document.getElementById('cfgPort').value = credentials.port || '8728';
      document.getElementById('cfgUser').value = credentials.user || '';
    }
  } catch {}
}

// ─── Chart setup ─────────────────────────────────────────────────────────────
function initChart() {
  const ctx = document.getElementById('trafficChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'RX',
          data: [...rxData],
          borderColor: '#00d4ff',
          backgroundColor: 'rgba(0,212,255,0.08)',
          borderWidth: 2,
          pointRadius: 0,
          fill: true,
          tension: 0.4,
        },
        {
          label: 'TX',
          data: [...txData],
          borderColor: '#ff6b35',
          backgroundColor: 'rgba(255,107,53,0.08)',
          borderWidth: 2,
          pointRadius: 0,
          fill: true,
          tension: 0.4,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false },
        y: {
          min: 0,
          grid: { color: 'rgba(30,45,69,0.8)' },
          ticks: {
            color: '#4a6080',
            font: { family: 'Share Tech Mono', size: 10 },
            callback: v => v.toFixed(1) + ' M'
          }
        }
      }
    }
  });
}

function updateChart(rx, tx) {
  rxData.push(rx); rxData.shift();
  txData.push(tx); txData.shift();
  const t = new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  labels.push(t); labels.shift();
  chart.data.labels = [...labels];
  chart.data.datasets[0].data = [...rxData];
  chart.data.datasets[1].data = [...txData];
  chart.update('none');
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function bytesToGb(b) { return (parseInt(b || 0) / 1e9).toFixed(2) + ' GB'; }
function bpsToMbps(b) { return (b / 1e6).toFixed(2); }

async function apiCall(endpoint, body) {
  const url = backendUrl.replace(/\/$/, '') + endpoint;
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...credentials, ...body })
  });
  return r.json();
}

// ─── Connect ─────────────────────────────────────────────────────────────────
document.getElementById('btnConnect').addEventListener('click', async () => {
  const btn = document.getElementById('btnConnect');
  const err = document.getElementById('errMsg');
  err.style.display = 'none';

  backendUrl = document.getElementById('cfgBackend').value.trim();
  if (!backendUrl) { showErr('Ingresa la URL del backend'); return; }

  credentials = {
    host: document.getElementById('cfgHost').value.trim(),
    port: parseInt(document.getElementById('cfgPort').value) || 8728,
    user: document.getElementById('cfgUser').value.trim(),
    pass: document.getElementById('cfgPass').value,
  };

  if (!credentials.host || !credentials.user) { showErr('Completa host y usuario'); return; }

  btn.innerHTML = 'CONECTANDO <span class="loader"></span>';
  btn.disabled = true;

  try {
    const res = await apiCall('/api/connect', {});
    if (!res.ok) throw new Error(res.error || 'Error de conexión');

    // Load interfaces
    const ifRes = await apiCall('/api/interfaces', {});
    if (!ifRes.ok) throw new Error(ifRes.error);

    saveConfig();
    buildIfaceRow(ifRes.data);
    showDash();
    startPolling();
  } catch(e) {
    showErr(e.message);
  } finally {
    btn.innerHTML = 'CONECTAR';
    btn.disabled = false;
  }
});

function showErr(msg) {
  const el = document.getElementById('errMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function buildIfaceRow(ifaces) {
  const row = document.getElementById('ifaceRow');
  row.innerHTML = '';
  // Filter running interfaces
  const active = ifaces.filter(i => i.running === 'true' || i.running === true);
  const list = active.length ? active : ifaces;
  list.slice(0, 10).forEach((iface, idx) => {
    const btn = document.createElement('button');
    btn.className = 'iface-btn' + (idx === 0 ? ' active' : '');
    btn.textContent = iface.name;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.iface-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedIface = iface.name;
      prevRx = prevTx = prevTs = null;
    });
    if (idx === 0) selectedIface = iface.name;
    row.appendChild(btn);
  });
}

// ─── Polling ─────────────────────────────────────────────────────────────────
function startPolling() {
  pollOnce();
  pollTimer = setInterval(pollOnce, 3000);
}

async function pollOnce() {
  try {
    const res = await apiCall('/api/traffic', { interface: selectedIface });
    if (!res.ok) return;

    const d = res.data;
    const ts = res.timestamp;
    const rx = parseInt(d['rx-byte'] || 0);
    const tx = parseInt(d['tx-byte'] || 0);

    // Total
    document.getElementById('totalRx').textContent = bytesToGb(rx);
    document.getElementById('totalTx').textContent = bytesToGb(tx);

    // Speed (bps)
    if (prevRx !== null && prevTs !== null) {
      const dt = (ts - prevTs) / 1000;
      const rxRate = Math.max(0, (rx - prevRx) * 8 / dt);
      const txRate = Math.max(0, (tx - prevTx) * 8 / dt);

      document.getElementById('rxSpeed').textContent = bpsToMbps(rxRate);
      document.getElementById('txSpeed').textContent = bpsToMbps(txRate);
      updateChart(rxRate / 1e6, txRate / 1e6);
    }

    prevRx = rx; prevTx = tx; prevTs = ts;

    // Status
    document.getElementById('statusDot').className = 'status-dot online';
    document.getElementById('lastUpdate').textContent =
      new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  } catch(e) {
    document.getElementById('statusDot').className = 'status-dot';
  }
}

// ─── Navigation ───────────────────────────────────────────────────────────────
function showDash() {
  document.getElementById('screenConfig').classList.remove('active');
  document.getElementById('screenDash').classList.add('active');
  if (!chart) initChart();
}

function showConfig() {
  document.getElementById('screenDash').classList.remove('active');
  document.getElementById('screenConfig').classList.add('active');
  if (pollTimer) clearInterval(pollTimer);
  document.getElementById('statusDot').className = 'status-dot';
}

document.getElementById('btnDisconnect').addEventListener('click', showConfig);

// ─── Boot ─────────────────────────────────────────────────────────────────────
loadConfig();
</script>
</body>
</html>
